# Experimento DESCARTAVEL (branch de desenvolvimento do Claude, nunca a oficial):
# mede se um tradutor LOCAL da conta das respostas das fichas, PT -> ES.
# O conteiner do Claude nao alcanca os servidores de modelo; o runner alcanca.
name: Experimento traducao local

on:
  push:
    branches: ["claude/github-workflow-plugins-npjakh"]
    paths:
      - "experimentos/traducao_local/**"
      - ".github/workflows/experimento-traducao.yml"

permissions:
  contents: read

jobs:
  qualidade-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install ctranslate2 sentencepiece huggingface_hub sacremoses
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5"
      - name: Converter o tc-big para CTranslate2
        working-directory: experimentos/traducao_local
        run: python avaliar.py converter --saida modelo_tc_big
      - name: Avaliar
        working-directory: experimentos/traducao_local
        run: python avaliar.py avaliar --modelo modelo_tc_big --argos --hf
      - uses: actions/upload-artifact@v4
        with:
          name: modelo-tc-big
          path: experimentos/traducao_local/modelo_tc_big
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-linux
          path: experimentos/traducao_local/resultados.json

  velocidade-windows:
    needs: qualidade-linux
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar (so o que o app levaria)
        run: |
          python -m pip install --upgrade pip
          pip install ctranslate2 sentencepiece
      - uses: actions/download-artifact@v4
        with:
          name: modelo-tc-big
          path: experimentos/traducao_local/modelo_tc_big
      - name: Avaliar
        working-directory: experimentos/traducao_local
        run: python avaliar.py avaliar --modelo modelo_tc_big
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-windows
          path: experimentos/traducao_local/resultados.json
