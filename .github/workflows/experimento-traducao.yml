# Experimento DESCARTAVEL (branch de desenvolvimento do Claude, nunca a oficial).
# Rodada 3: o CODIGO DE PRODUCAO do tradutor local contra o modelo de verdade,
# no Linux e no Windows. O conteiner do Claude nao alcanca o Hugging Face.
name: Experimento traducao local

on:
  push:
    branches: ["claude/github-workflow-plugins-npjakh"]
    paths:
      - "experimentos/traducao_local/**"
      - ".github/workflows/experimento-traducao.yml"
      - "sigft/core/tradutor_local.py"
      - "sigft/services/traducao_respostas.py"
      - "tools/preparar_tradutor.py"
      - "tests/test_tradutor_local.py"

permissions:
  contents: read

jobs:
  prova-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install requests openpyxl python-dotenv pillow
          pip install ctranslate2 sentencepiece huggingface_hub
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5"
      - name: Preparar o modelo (script de producao)
        run: |
          python tools/preparar_tradutor.py
          python tools/preparar_tradutor.py --verificar
          ls -la recursos/tradutor_pt_es
      - name: Testes com o modelo de verdade
        run: python -m pytest -q -rs tests/test_tradutor_local.py tests/test_traducao_respostas.py tests/test_preparar_tradutor.py
      - name: As 88 respostas pelo caminho de producao
        if: always()
        run: python experimentos/traducao_local/avaliar_producao.py
      - uses: actions/upload-artifact@v4
        with:
          name: tradutor-pt-es
          path: recursos/tradutor_pt_es
          retention-days: 3

  prova-windows:
    needs: prova-linux
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar (so o que o app leva)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install requests openpyxl python-dotenv pillow ctranslate2 sentencepiece
      - uses: actions/download-artifact@v4
        with:
          name: tradutor-pt-es
          path: recursos/tradutor_pt_es
      - name: Testes com o modelo de verdade
        run: python -m pytest -q -rs tests/test_tradutor_local.py tests/test_traducao_respostas.py
      - name: As 88 respostas pelo caminho de producao
        if: always()
        run: python experimentos/traducao_local/avaliar_producao.py
