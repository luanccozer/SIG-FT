name: Teste do proxy (limpeza)
on:
  push:
    branches: [claude/teste-proxy-zscaler]
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Apaga o release de teste 0.0.1 e a tag dele
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.1-rc.1 -R "$REPO" >/dev/null 2>&1; then
            gh release delete v0.0.1-rc.1 -R "$REPO" --yes --cleanup-tag
          fi
          git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" | grep -c "v0.0.1" || true
          gh release view v0.0.1-rc.1 -R "$REPO" >/dev/null 2>&1 && { echo "AINDA EXISTE"; exit 1; } || echo "apagado"
