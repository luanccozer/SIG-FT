name: Diag Windows fatal Qt
on:
  push:
    branches: [claude/diag-windows-fatal]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pip install -q -r requirements-dev.txt
      - name: test_qt_corte no Windows
        run: python -m pytest -q tests/test_qt_corte.py -p no:cacheprovider
